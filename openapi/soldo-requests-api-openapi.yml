    delete:
      tags:
      - Requests
      summary: Delete Request
      description: Endpoint to remove an `Request`.
      operationId: request-delete
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
          description: The `Request` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
