          type: integer
          format: int64
          description: The epoch timestamp in millis. This is checked in Soldo. Requests with timestamp older than 5 seconds will be rejected.
          example: 1576850500000
        date:
          type: string
          description: The date and time of the `Transaction`.
          example: '2017-06-01T12:48:40Z'
        owner_id:
          type: string
          description: 'The ID of the `User` who made the `Transaction` (updatable: no).'
          example: XMPL1234-000002
        merchant_name:
          type: string
          description: The name of the `Merchant` for the `Transaction`.
          example: SHH HOTEL LONDON
        tx_amount:
          type: number
          description: The amount of the `Transaction`, in the currency of the `Merchant`.
          example: 10.25
        tx_amount_currency:
          $ref: '#/components/schemas/ISO4217Currency'
          description: The currency [ISO 4217](https://www.six-group.com/en/products-services/financial-information/data-standards.html#scrollTo=maintenance-agency) code of the `tx_amount`.
          example: EUR
        exchange_rate:
          type: number
          description: The exchange rate used to convert the `tx_amount` from the currency of the `Merchant` to the currency of the main `Wallet`. If needed and not provided, a default rate is derived from `date`.
