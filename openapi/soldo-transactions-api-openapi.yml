    MileageReimbursementDetailsUpdateRequest:
      properties:
        vehicle_id:
          type: string
          description: The ID of the `Vehicle` used, if registered.
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
        reimbursement_rate:
          type: number
          description: The rate to apply to the covered distance (measured in km) for the reimbursement, assuming the main `Wallet` currency. Required if `vehicle_id` is missing or if no reimbursement rate is set for the related `Vehicle`. Overridden if `vehicle_id` is set and a reimbursement rate is set for the related `Vehicle`.
          example: 0.45
        description:
          type: string
          description: The description for the trip.
          example: 'Business trip: Rome - Florence - Turin - Milan'
        starting_point:
          type: string
          description: The place where the travel started.
          example: Rome, Metropolitan City of Rome Capital, Italy
        arrival_point:
          type: string
          description: The point where the travel ended.
          example: Milan, Metropolitan City of Milan, Italy
        multi_stops:
          type: array
          description: The intermediate stops during the travel.
          example:
          - Florence, Metropolitan City of Florence, Italy
          - Turin, Metropolitan City of Turin, Italy
          items:
            type: string
        distance:
          type: number
          description: The travelled distance from the starting point to the arrival point (measured in km).
          example: 875.4
        round_trip:
          type: boolean
          description: Whether the distance has been travelled twice due to a round trip.
          example: true
      required:
      - description
      - distance
      - round_trip
    DateParam:
      description: 'The end of the period of the search `toDate` included (i.e. less than) (Formats: `yyyy-MM-dd`, `yyyy-MM-ddThh:mm:ss`, `yyyy-MM-ddThh:mm:ssZ`).'
      example: '1970-01-30'
    TransactionCategory:
      type: string
      enum:
