openapi: 3.2.0
info:
  title: Soldo Business API v2.0 Subscriptions API
  description: Soldo Business API v2.0 OpenAPI specification
  version: 5.56.0
servers:
- url: https://api.soldo.com
  description: Production server (using live data)
- url: https://api-demo.soldocloud.net
  description: Sandbox server (using test data)
tags:
- name: Subscriptions
paths:
  /business/v2/subscriptions/{subscriptionId}:
    get:
      tags:
      - Subscriptions
      summary: Get Subscription
      operationId: subscription-get
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          description: The `Subscription` ID
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      responses:
        '200':
          description: The returned resource is a `Subscription`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '404':
          description: One or more resource requested does not exist.
      security:
      - standardAuth:
        - subscription_read
    put:
      tags:
      - Subscriptions
      summary: Update Subscription
      description: Endpoint to update a specific `Subscription`.
      operationId: subscription-update
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          description: The `Subscription` id.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint}}'
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint_signature}}'
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscription'
      responses:
        '200':
          description: The returned resource is a `Subscription`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_write
      x-soldo:
        fingerprint-order: id, name, wallet_id, payment_frequency, token
    post:
      tags:
      - Subscriptions
      summary: Activate Subscription
      description: Endpoint to activate a specific `Subscription`.
      operationId: subscription-activate
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          description: The `Subscription` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint}}'
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint_signature}}'
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
      responses:
        '200':
          description: The returned resource is an `Order`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_write
      x-soldo:
        fingerprint-order: id, token
    delete:
      tags:
      - Subscriptions
      summary: Delete Subscription
      description: Endpoint to delete a specific `Subscription`.
      operationId: subscription-delete
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          description: The `Subscription` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      responses:
        '204':
          description: No content as result.
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_write
  /business/v2/subscriptions/{subscriptionId}/addAssignees:
    put:
      tags:
      - Subscriptions
      summary: Add assignees to Subscription
      description: Endpoint to add assignees to a `Subscription`.
      operationId: subscription-assignees-add
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          description: The `Subscription` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint}}'
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint_signature}}'
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssignees'
      responses:
        '200':
          description: The returned resource is a `Subscription`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_write
      x-soldo:
        fingerprint-order: id, token
  /business/v2/subscriptions:
    get:
      tags:
      - Subscriptions
      summary: Search Subscriptions
      description: Endpoint to find `Subscriptions` using filtering parameters.
      operationId: subscription-search
      parameters:
      - name: text
        in: query
        description: A simple text to search in the Subscription data (name, description, assignee name).
        schema:
          type: string
          description: A simple text to search in the Subscription data (name, description, assignee name).
          example: something
        example: something
      - name: assignees
        in: query
        schema:
          type: array
          description: The `Subscription` assignees.
          example: 776f5018-07e5-426b-a426-8b23fa1e985d
          items:
            type: string
            description: The `Subscription` assignees.
            example: 776f5018-07e5-426b-a426-8b23fa1e985d
      - name: statuses
        in: query
        description: The `Subscription` status.
        schema:
          type: array
          description: The `Subscription` status.
          items:
            $ref: '#/components/schemas/SubscriptionStatus'
          uniqueItems: true
        example: ACTIVE
      - name: p
        in: query
        description: It indicates the specific page to display (the counter starts from zero).
        schema:
          type: integer
          format: int32
          default: 0
          description: It indicates the specific page to display (the counter starts from zero).
          example: 3
        example: 3
      - name: s
        in: query
        description: It indicates the number of items per page.
        schema:
          type: integer
          format: int32
          default: 0
          description: It indicates the number of items per page.
          example: 25
          maximum: 50
        example: 25
      - name: d
        in: query
        description: It indicates how the pages are ordered.
        schema:
          $ref: '#/components/schemas/Direction'
        example: DESC
      - name: props
        in: query
        description: It indicates the sorting direction applied to the above parameters. To apply a sorting on multiple parameters, set as many times the `props` parameter in the request.
        schema:
          type: array
          description: It indicates the sorting direction applied to the above parameters. To apply a sorting on multiple parameters, set as many times the `props` parameter in the request.
          example: creationTime
          items:
            type: string
            description: It indicates the sorting direction applied to the above parameters. To apply a sorting on multiple parameters, set as many times the `props` parameter in the request.
            example: creationTime
        example: creationTime
      responses:
        '200':
          description: The returned result is an array containing `Subscriptions`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriptions'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_read
    post:
      tags:
      - Subscriptions
      summary: Add Subscription
      description: Endpoint to add a new `Subscription`.
      operationId: subscription-add
      parameters:
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint}}'
          description: '[Advanced authentication](ref:advanced-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this endpoint.'
          example: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint_signature}}'
          description: '[Advanced authentication](ref:advanced-authentication): Signature of the `X-Soldo-Fingerprint`.'
          example: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscription'
      responses:
        '200':
          description: The returned resource is a `Subscription`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_write
      x-soldo:
        fingerprint-order: name, platform, wallet_id, payment_frequency, token
  /business/v2/subscriptions/{subscriptionId}/removeAssignees:
    put:
      tags:
      - Subscriptions
      summary: Remove assignees from Subscription
      description: Endpoint to remove assignees from a `Subscription`.
      operationId: subscription-assignees-remove
      parameters:
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          description: The `Subscription` id.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveAssignees'
      responses:
        '200':
          description: The returned resource is a `Subscription`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Your request has missing arguments or is malformed.
      security:
      - standardAuth:
        - subscription_write
webhooks:
  subscription_assignee_added:
    post:
      tags:
      - Subscriptions
      summary: Subscription - Subscription Assignee Added
      description: A `Subscription` assignee is added.
      operationId: webhook-subscription-subscription-assignee-added
      parameters:
      - name: X-Soldo-Fingerprint
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint}}'
          description: '[Webhook authentication](ref:webhook-authentication): `SHA512SUM` of the fingerprint values listed in the fingerprint order for this webhook.'
          example: '{{fingerprint}}'
      - name: X-Soldo-Fingerprint-Order
        in: header
        required: true
        schema:
          type: string
          default: id, name, platform, status, paymentFrequency, cardId
          description: '[Webhook authentication](ref:webhook-authentication): The order of the values used to calculate the fingerprint.'
          example: id, name, platform, status, paymentFrequency, cardId
      - name: X-Soldo-Fingerprint-Signature
        in: header
        required: true
        schema:
          type: string
          default: '{{fingerprint_signature}}'
          description: '[Webhook authentication](ref:webhook-authentication): Signature of the `X-Soldo-Fingerprint`. It must be verified using the [Soldo public key](ref:soldo-public-key).'
          example: '{{fingerprint_signature}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAssigneeAddedEvent'
      responses:
        '200':
          description: Success.
      x-soldo:
        fingerprint-order: id, name, platform, status, paymentFrequency, cardId
