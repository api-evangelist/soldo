components:
  schemas:
    Subscription:
      properties:
        id:
          type: string
          description: The `Subscription` ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        name:
          type: string
          description: The name of the `Subscription`.
          example: EXAMPLE SUBSCRIPTION.
        description:
          type: string
          description: A custom description of the `Subscription`.
          example: This is a subscription
        platform:
          $ref: '#/components/schemas/SubscriptionPlatform'
          description: The platform the `Subscription` is made on.
          example: OTHER
        assignees:
          type: array
          description: List of `User` ID currently assigned to the `Subscription` and its `Card`.
          example:
          - XMPL1234-000001
          - XMPL1234-000002
          - XMPL1234-000003
          items:
            type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
          description: The status of the `Subscription`.
          example: ACTIVE
        wallet_id:
          type: string
          description: The ID of the `Wallet` the `Subscription` and its `Card` are linked to.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        payment_frequency:
          $ref: '#/components/schemas/SubscriptionPaymentFrequency'
          description: The payment frequency indicates how often a `Transaction` is expected to be made.
          example: YEARLY
        last_spent:
          type: number
          description: The amount of the last `Transaction` made with the `Card`.
          example: 75.01
        total_spent:
          type: number
          description: The overall amount spent with the `Card`.
          example: 775.01
        card_id:
          type: string
          description: The ID of the `Card` reserved for this `Subscription` (only available after the subscription is activated).
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
        last_spent_date:
          type: string
          description: The date and time of the last `Transaction` made with the `Card`.
          example: '2020-05-07T12:48:40Z'
        creation_time:
          type: string
          description: The date and time when the `Subscription` was last updated.
          example: '2017-06-01T12:48:40Z'
        last_update_time:
          type: string
          description: The date and time when the `Subscription` was last updated.
          example: '2017-06-01T12:48:40Z'
    SubscriptionStatus:
      type: string
      enum:
      - ACTIVE
      - ASSIGNED
      - CANCELLED
    CreateSubscription:
      description: Add `Subscription` JSON parameters.
      properties:
        name:
          type: string
          description: The name of the `Subscription`.
          example: Google Ads
        description:
          type: string
          description: The description of the `Subscription`.
          example: This is a resource set
        platform:
          $ref: '#/components/schemas/SubscriptionPlatform'
          description: The platform of the `Subscription`.
          example: GOOGLE
        assignees:
          type: array
          description: The assignees of the `Subscription`.
          example:
          - XMPL1234-000001
          - XMPL1234-000002
          - XMPL1234-000003
          items:
            type: string
        wallet_id:
          type: string
          description: The ID of the associated `Wallet`.
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
        payment_frequency:
          $ref: '#/components/schemas/SubscriptionPaymentFrequency'
          description: The payment frequency indicates how often a `Transaction` is expected to be made.
          example: YEARLY
      required:
      - assignees
      - description
      - name
      - payment_frequency
      - platform
      - wallet_id
    RemoveAssignees:
      description: Remove `Subscription` assignees JSON parameters.
      properties:
        remove_assignees:
          type: array
          description: List of `User` IDs to remove from assignees.
          example:
          - XMPL1234-000001
          - XMPL1234-000002
          - XMPL1234-000003
          items:
            type: string
      required:
      - remove_assignees
    SubscriptionAssigneeAddedEvent:
      properties:
        event_uuid:
          type: string
          description: The webhook unique ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
          default: Subscription
          description: The webhook event type.
          example: Subscription
        event_name:
          $ref: '#/components/schemas/WebhookEventName'
          default: subscription_assignee_added
          description: The webhook event name.
          example: subscription_assignee_added
        company_account_id:
          type: string
          description: The company account ID.
          example: XMPL1234
        data:
          $ref: '#/components/schemas/Subscription'
          description: The webhook `Subscription` data.
        subscription_id:
          type: string
          description: The webhook subscription ID used to route this event.
          example: 2d65bd5e-3fdf-4002-b166-bde7fb8863fa
    SubscriptionUpdatedEvent:
      properties:
        event_uuid:
          type: string
          description: The webhook unique ID.
          example: 7bf79328-a7ae-4222-aa54-091ff7f429a7
        event_type:
          $ref: '#/components/schemas/WebhookEventType'
          default: Subscription
          description: The webhook event type.
          example: Subscription
        event_name:
          $ref: '#/components/schemas/WebhookEventName'
          default: subscription_updated
          description: The webhook event name.
          example: subscription_updated
        company_account_id:
          type: string
          description: The company account ID.
          example: XMPL1234
        data:
          $ref: '#/components/schemas/Subscription'
          description: The webhook `Subscription` data.
        subscription_id:
