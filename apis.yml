aid: soldo
name: Soldo
description: >-
  Soldo is a pan-European spend management and prepaid business card platform
  that pairs Mastercard company cards with software for budgeting, expense
  tracking, and accounting reconciliation. The Soldo Business API (v2.0, OpenAPI
  3.1) lets businesses programmatically issue and control cards, manage wallets
  and internal transfers, read and reconcile transactions, run expense reports
  and reviews, manage users, groups and roles, handle documents and receipts,
  and subscribe to 81 webhook event types. Authentication is OAuth 2.0 Client
  Credentials, with request-signed "advanced authentication" (SHA512withRSA
  fingerprints) layered on top for money movement and sensitive changes. Soldo
  also operates a separate PSD2 / Open Banking API.
url: https://raw.githubusercontent.com/api-evangelist/soldo/refs/heads/main/apis.yml
